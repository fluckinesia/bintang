plugins { id 'com.android.application' }
android {
    namespace 'id.test.fixedbrowser'
    compileSdk 36
    defaultConfig {
        applicationId 'id.test.fixedbrowser'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
